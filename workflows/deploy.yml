name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # ручной запуск из вкладки Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Скачиваем исходники
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Ставим Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 4. Собираем проект
      - name: Build
        run: npm run build

      # 5. Заливаем готовый билд в GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build          # если у тебя dist – поменяй на ./dist

      # 6. Публикуем
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
