<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Судебные Экспертизы в Крыму</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Configuration and Styles -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#050505",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Instrument Serif", "serif"],
            },
            animation: {
              "beam-fall": "beam-fall 6s linear infinite",
              "spin-slow": "spin 3s linear infinite",
            },
            keyframes: {
              "beam-fall": {
                "0%": { transform: "translateY(-100%)", opacity: "0" },
                "5%": { opacity: "0.5" },
                "50%": { opacity: "1" },
                "95%": { opacity: "0.5" },
                "100%": { transform: "translateY(100vh)", opacity: "0" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #050505;
        color: white;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 0px;
      }

      /* 3D Transform Utilities */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }

      /* Button Particle Animation */
      .points_wrapper {
        overflow: hidden;
        width: 100%;
        height: 100%;
        pointer-events: none;
        position: absolute;
        z-index: 1;
      }
      .points_wrapper .point {
        bottom: -10px;
        position: absolute;
        animation: floating-points infinite ease-in-out;
        pointer-events: none;
        width: 2px;
        height: 2px;
        background-color: #fff;
        border-radius: 9999px;
      }
      @keyframes floating-points {
        0% { transform: translateY(0); }
        85% { opacity: 0; }
        100% { transform: translateY(-55px); opacity: 0; }
      }
      .points_wrapper .point:nth-child(1) { left: 10%; opacity: 1; animation-duration: 2.35s; animation-delay: 0.2s; }
      .points_wrapper .point:nth-child(2) { left: 30%; opacity: 0.7; animation-duration: 2.5s; animation-delay: 0.5s; }
      .points_wrapper .point:nth-child(3) { left: 25%; opacity: 0.8; animation-duration: 2.2s; animation-delay: 0.1s; }
      .points_wrapper .point:nth-child(4) { left: 44%; opacity: 0.6; animation-duration: 2.05s; }
      .points_wrapper .point:nth-child(5) { left: 50%; opacity: 1; animation-duration: 1.9s; }
      .points_wrapper .point:nth-child(6) { left: 75%; opacity: 0.5; animation-duration: 1.5s; animation-delay: 1.5s; }

      /* Custom Animations classes */
      .animate-fade-slide-in {
        animation: fadeSlideIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes fadeSlideIn {
        0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
      }
      
      /* Accordion Icon Rotation */
      details[open] summary .accordion-icon {
        transform: rotate(180deg);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
  <body class="min-h-screen bg-[#050505] text-white font-sans antialiased selection:bg-orange-500/30 flex flex-col overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
